[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-eclab"
version = "0.1.4"
description = "Name the columns of BioLogic EC-Lab .mpr files that your parser does not know - no language model, evidence for every answer"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Nataniel Ataseven" }]
requires-python = ">=3.10"
keywords = ["electrochemistry", "biologic", "ec-lab", "mpr", "battery", "potentiostat", "file-format"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# galvani is not a dependency: two distributions install the module (galvani and datalab-org-galvani),
# and requiring one would overwrite the other. Rosetta uses whichever is installed, or a frozen copy
# of galvani 0.5.0's column map (spike2/galvani_0.5.0_colmap.json).
dependencies = [
    "numpy>=2.0",
    "yadg==7.0.1",
]

[project.urls]
Repository = "https://github.com/Nataniel0212/rosetta-eclab"
Issues = "https://github.com/Nataniel0212/rosetta-eclab/issues"

[project.optional-dependencies]
test = ["pytest", "galvani==0.5.0"]

[project.scripts]
rosetta = "rosetta_eclab.cli:main"

# The source folder is namer/ (every reproduction command uses python -m namer.*), but it installs
# as rosetta_eclab: a package called "namer" already exists on PyPI.
[tool.setuptools]
packages = ["rosetta_eclab", "spike2"]

[tool.setuptools.package-dir]
rosetta_eclab = "namer"

[tool.setuptools.package-data]
rosetta_eclab = ["data/*.json", "data/*.npy"]
spike2 = ["*.json"]
